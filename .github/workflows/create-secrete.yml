name: Auto-Generate and Save Keystore Secret

on:
  workflow_dispatch:

jobs:
  generate-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore inventa-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias inventa \
            -storepass InventaPass123 \
            -keypass InventaPass123 \
            -dname "CN=Inventa, OU=App, O=Inventa, L=City, ST=State, C=US"

      - name: Base64 Encode
        run: |
          base64 -w 0 inventa-release.jks > keystore-base64.txt

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Upload Secret to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh secret set KEYSTORE_BASE64 < keystore-base64.txt --repo ${{ github.repository }}