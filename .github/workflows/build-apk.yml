name: Build and Package APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Keystore on the fly
      run: |
        keytool -genkey -v -keystore android/app/inventa-release.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias inventa \
          -storepass InventaPass123 \
          -keypass InventaPass123 \
          -dname "CN=Inventa, OU=App, O=Inventa, L=City, ST=State, C=US"

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Release APK
      working-directory: ./android
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/inventa-release.jks \
          -Pandroid.injected.signing.store.password="InventaPass123" \
          -Pandroid.injected.signing.key.alias="inventa" \
          -Pandroid.injected.signing.key.password="InventaPass123"

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: Inventa-Release-Bundle
        # Upload both the APK and the Keystore file so you have them
        path: |
          android/app/build/outputs/apk/release/app-release.apk
          android/app/inventa-release.jks