name: Build and Package APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Generate Keystore on the fly
      run: |
        keytool -genkey -v -keystore android/app/inventa-release.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias inventa \
          -storepass InventaPass123 \
          -keypass InventaPass123 \
          -dname "CN=Inventa, OU=App, O=Inventa, L=City, ST=State, C=US"

    - name: Force Fix AndroidManifest
      run: |
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.microphone" android:required="false" />
            <application
                android:name=".InventaApp"
                android:allowBackup="true"
                android:usesCleartextTraffic="false"
                android:icon="@mipmap/ic_launcher"
                android:label="INVENTA"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # --- NEW STEP: GENERATE PLACEHOLDER ICON ---
    - name: Generate Placeholder Icon
      run: |
        mkdir -p android/app/src/main/res/mipmap-hdpi
        # Create a basic 1x1 transparent PNG to satisfy the compiler
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

    - name: Build Release APK
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      run: |
        cd android
        gradle wrapper --gradle-version 8.13
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/inventa-release.jks \
          -Pandroid.injected.signing.store.password="InventaPass123" \
          -Pandroid.injected.signing.key.alias="inventa" \
          -Pandroid.injected.signing.key.password="InventaPass123"

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: Inventa-Release-Bundle
        path: |
          android/app/build/outputs/apk/release/app-release.apk
          android/app/inventa-release.jks