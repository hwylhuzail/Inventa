- name: Decode Keystore
  env:
    ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
  run: |
    # 1. Remove all characters that are NOT part of a Base64 string
    # 2. Decode it
    echo "$ENCODED_STRING" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > android/app/inventa-release.jks
    
    # Check if the file was actually created and has size
    if [ ! -s android/app/inventa-release.jks ]; then
      echo "ERROR: Keystore file is empty. The secret is corrupted."
      exit 1
    fi