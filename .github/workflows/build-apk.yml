name: Build and Package APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # --- THIS IS THE FIX ---
    # We force Gradle to use version 8.11.1 to match your Android plugin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Generate Keystore on the fly
      run: |
        keytool -genkey -v -keystore android/app/inventa-release.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias inventa \
          -storepass InventaPass123 \
          -keypass InventaPass123 \
          -dname "CN=Inventa, OU=App, O=Inventa, L=City, ST=State, C=US"

    - name: Build Release APK
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      run: |
        cd android
        # Generates the gradlew file using the specific Gradle version
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew
        # Builds the APK
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/inventa-release.jks \
          -Pandroid.injected.signing.store.password="InventaPass123" \
          -Pandroid.injected.signing.key.alias="inventa" \
          -Pandroid.injected.signing.key.password="InventaPass123"

    - name: Upload APK and Keystore
      uses: actions/upload-artifact@v4
      with:
        name: Inventa-Release-Bundle
        path: |
          android/app/build/outputs/apk/release/app-release.apk
          android/app/inventa-release.jks