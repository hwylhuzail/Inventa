name: Generate Keystore

on:
  workflow_dispatch: # This lets you run it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          # Generate the keystore (Change the passwords and alias below if you want)
          keytool -genkey -v -keystore inventa-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias inventa \
            -storepass InventaPass123 \
            -keypass InventaPass123 \
            -dname "CN=Inventa, OU=App, O=Inventa, L=City, ST=State, C=US"

      - name: Convert to Base64
        run: |
          base64 inventa-release.jks > keystore-base64.txt

      # This prints the Base64 string to the GitHub Action logs
      - name: Print Base64
        run: cat keystore-base64.txt